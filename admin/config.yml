# Decap CMS config
# Replace OWNER/REPO with your GitHub org+repo once you've pushed the project.
# After deploy: enable Netlify Identity OR wire a Cloudflare Worker OAuth proxy
# (see /CLAUDE.md "Step 3 — Decap CMS" for details).

backend:
  name: github
  repo: OWNER/REPO          # e.g. christhia-seva-mission/site
  branch: main
  # If using Netlify Identity instead of bare GitHub OAuth, swap to:
  # name: git-gateway

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: students
    label: Students (active)
    files:
      - name: students
        label: All students
        file: data/students.json
        fields:
          - { name: students, label: Students, widget: list, fields: [
              { name: id,        label: ID slug,    widget: string },
              { name: name,      label: Name,       widget: string },
              { name: age,       label: Age,        widget: number },
              { name: course,    label: Course,     widget: string },
              { name: school,    label: School,     widget: string },
              { name: village,   label: Village,    widget: select, options: [Bagepalli, Chelur, Chickaballapur, Chintamani, Devaganhalli, Gowribindanur, Gudibande, Kodigenhalli, Peresandra, Shidalagatta] },
              { name: raised,    label: Raised ($), widget: number, default: 0 },
              { name: goal,      label: Goal ($),   widget: number, default: 200 },
              { name: sponsored, label: Sponsored?, widget: boolean, default: false },
              { name: days,      label: Days left,  widget: number, default: 30 },
              { name: tag,       label: Category,   widget: select, options: [Healthcare, Trade, Business, Ministry, Technology, Education, Agriculture] },
              { name: photo,     label: Photo,      widget: image,  required: false }
            ]}

  - name: churches
    label: Churches
    files:
      - name: churches
        label: All churches
        file: data/churches.json
        fields:
          - { name: churches, label: Churches, widget: list, fields: [
              { name: id,          label: ID slug,    widget: string },
              { name: town,        label: Town,       widget: string },
              { name: established, label: Year,       widget: number },
              { name: members,     label: Members,    widget: number },
              { name: pastor,      label: Pastor,     widget: string },
              { name: status,      label: Status,     widget: select, options: [mature, growing, new] },
              { name: note,        label: Description, widget: text },
              { name: needs,       label: Active need, widget: object, required: false, fields: [
                  { name: kind,   label: Kind,    widget: select, options: [building, pastor] },
                  { name: goal,   label: Goal,    widget: number },
                  { name: raised, label: Raised,  widget: number },
                  { name: label,  label: Label,   widget: string }
              ]}
            ]}

  - name: stories
    label: Student stories
    files:
      - name: stories
        label: All stories
        file: data/stories.json
        fields:
          - { name: stories, label: Stories, widget: list, fields: [
              { name: id,       label: ID slug, widget: string },
              { name: name,     label: Name,    widget: string },
              { name: village,  label: Village, widget: string },
              { name: status,   label: Status,  widget: select, options: [past, current] },
              { name: role,     label: Role/title (past), widget: string, required: false },
              { name: headline, label: Headline, widget: string },
              { name: summary,  label: Summary,  widget: text },
              { name: invested, label: Invested (past), widget: string, required: false },
              { name: outcome,  label: Outcome (past),  widget: string, required: false },
              { name: tag,      label: Category, widget: string }
            ]}

  - name: site
    label: Site settings
    files:
      - name: site
        label: Mission info
        file: data/site.json
        fields:
          - { name: mission_name, label: Mission name, widget: string }
          - { name: tagline,      label: Tagline,      widget: string }
          - { name: stats, label: Headline stats, widget: object, fields: [
              { name: years, label: Years of ministry, widget: number },
              { name: churches, label: Churches, widget: number },
              { name: students_supported, label: Students supported, widget: string },
              { name: towns, label: Towns, widget: number }
            ]}
          - { name: donate_url, label: Donate URL, widget: string }
          - { name: contact, label: Contact, widget: object, fields: [
              { name: email,           label: Email,    widget: string, required: false },
              { name: phone,           label: Phone,    widget: string, required: false },
              { name: mailing_address, label: Address,  widget: text,   required: false }
            ]}
